<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Film grain">
  <title>Film grain</title>
  <!-- Turbulence grain. stitchTiles keeps the tile seamless, so it can be laid
       over the whole page to take the digital edge off flat gradients. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55"/>
    </feComponentTransfer>
  </filter>
  <rect width="220" height="220" filter="url(#grain)"/>
</svg>
