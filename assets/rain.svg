<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200" role="img" aria-label="Rain streaks">
  <title>Rain</title>
  <!-- Seamless, vertically tileable rain. Strokes run past both edges so the
       pattern can be scrolled downwards forever without a visible seam. -->
  <g stroke="#cfe0ea" stroke-linecap="round">
    <line x1="14" y1="-20" x2="34" y2="60" stroke-width="1" stroke-opacity=".20"/>
    <line x1="52" y1="20" x2="74" y2="108" stroke-width="1" stroke-opacity=".14"/>
    <line x1="96" y1="-10" x2="120" y2="86" stroke-width="1.4" stroke-opacity=".22"/>
    <line x1="130" y1="60" x2="152" y2="150" stroke-width="1" stroke-opacity=".16"/>
    <line x1="26" y1="120" x2="48" y2="210" stroke-width="1" stroke-opacity=".18"/>
    <line x1="72" y1="150" x2="94" y2="240" stroke-width="1" stroke-opacity=".12"/>
    <line x1="112" y1="180" x2="132" y2="260" stroke-width="1.2" stroke-opacity=".20"/>
    <line x1="6" y1="200" x2="28" y2="290" stroke-width="1" stroke-opacity=".15"/>
    <line x1="64" y1="-60" x2="86" y2="20" stroke-width="1.2" stroke-opacity=".17"/>
    <line x1="144" y1="-40" x2="164" y2="30" stroke-width="1" stroke-opacity=".13"/>
  </g>
</svg>
